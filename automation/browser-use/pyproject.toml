[project]
name = "omran-browser-automation"
version = "0.1.0"
description = "Isolated Browser Use worker for Omran Toys research and storefront QA"
requires-python = ">=3.11,<3.14"
dependencies = [
  "browser-use>=0.13,<0.14",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
omran-browser = "omran_browser:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omran_browser"]
