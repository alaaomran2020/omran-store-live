<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{font-family:Arial,"Noto Sans Arabic",sans-serif;color:#14251f;background:#f4f7f5}*{box-sizing:border-box}body{margin:0;padding:14px}.hero{background:#12345b;color:#fff;border-radius:16px;padding:16px}.hero h1{font-size:20px;margin:0 0 6px}.hero p{font-size:12px;line-height:1.7;margin:0;color:#dce9f5}.status{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.pill{padding:9px;border-radius:10px;font-size:11px;font-weight:700;text-align:center}.off{background:#fff2d8;color:#7c4b00;border:1px solid #f2c66d}.on{background:#ddf8e9;color:#09643b;border:1px solid #7fd2a7}.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0 10px}.tabs button{white-space:nowrap;border:1px solid #ccd8d2;background:#fff;border-radius:999px;padding:8px 11px;font-weight:700;color:#24483b}.tabs button.active{background:#356854;color:#fff;border-color:#356854}.panel{display:none;background:#fff;border:1px solid #d8e1dd;border-radius:14px;padding:13px;margin-bottom:12px}.panel.active{display:block}h2{font-size:16px;margin:0 0 12px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #b9c9c1;border-radius:9px;padding:10px;background:#fff;font:inherit}textarea{min-height:78px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;margin-top:12px;border:0;border-radius:10px;padding:11px;background:#356854;color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#12345b}.btn.danger{background:#9f2f2f}.btn:disabled{opacity:.5}.notice{display:none;margin:10px 0;border-radius:10px;padding:10px;font-size:12px;line-height:1.6}.notice.show{display:block}.notice.info{background:#e8f2ff;color:#12345b}.notice.ok{background:#ddf8e9;color:#09643b}.notice.err{background:#ffe5e5;color:#8d1d1d}.result{border-top:1px dashed #cbd8d2;margin-top:10px;padding-top:10px;font-size:12px;line-height:1.7;overflow-wrap:anywhere}.card{border:1px solid #d8e1dd;border-radius:10px;padding:10px;margin-top:8px}.qr{display:block;width:220px;height:220px;margin:10px auto;border:8px solid #fff;box-shadow:0 0 0 1px #ccd8d2}.muted{color:#617269;font-size:11px}.loading{opacity:.55;pointer-events:none}
  </style>
</head>
<body>
  <header class="hero"><h1>لوحة تشغيل Omran VIP</h1><p id="actor">جاري التحقق من الموظف…</p></header>
  <div class="status"><div id="financial" class="pill off">التشغيل المالي مقفول</div><div id="verification" class="pill off">التحقق العام مقفول</div></div>
  <nav class="tabs" aria-label="أقسام اللوحة">
    <button class="active" data-tab="issue">إصدار</button><button data-tab="activate">تفعيل</button><button data-tab="search">بحث</button><button data-tab="suspend">إيقاف/بديل</button><button data-tab="complaint">شكوى</button><button data-tab="staff">الموظفون</button>
  </nav>
  <div id="notice" class="notice"></div>

  <section id="issue" class="panel active"><h2>إصدار كارت جديد</h2><label>معرف المشترك</label><input id="issueSubscriber" placeholder="SUB-..." dir="ltr"><label>نوع الكارت</label><select id="issueType"></select><button class="btn" onclick="issueCard()">إصدار بحالة NEW</button><div id="issueResult" class="result"></div></section>
  <section id="activate" class="panel"><h2>تفعيل بعد إثبات الدفع</h2><label>معرف الكارت</label><input id="activateCard" dir="ltr"><label>مرجع الدفع</label><input id="paymentRef" dir="ltr"><button class="btn" onclick="activateCard()">تفعيل الكارت</button></section>
  <section id="search" class="panel"><h2>البحث عن كارت</h2><label>رقم الكارت أو العضوية أو الهاتف</label><input id="searchQuery" dir="ltr"><button class="btn secondary" onclick="searchCards()">بحث</button><div id="searchResult" class="result"></div></section>
  <section id="suspend" class="panel"><h2>إيقاف أو استبدال</h2><label>معرف الكارت</label><input id="actionCard" dir="ltr"><label>السبب</label><textarea id="actionReason"></textarea><button class="btn danger" onclick="suspendCard()">إيقاف الكارت</button><label>رسوم الاستبدال بالقروش — صفر افتراضيًا</label><input id="replacementFee" type="number" min="0" value="0" dir="ltr"><button class="btn secondary" onclick="replaceCard()">إصدار بديل</button><div id="replaceResult" class="result"></div></section>
  <section id="complaint" class="panel"><h2>تسجيل شكوى</h2><div class="row"><div><label>هاتف العميل</label><input id="complaintPhone" dir="ltr" inputmode="tel"></div><div><label>معرف الكارت</label><input id="complaintCard" dir="ltr"></div></div><div class="row"><div><label>قيمة الفاتورة بالقروش</label><input id="invoiceValue" type="number" min="0" value="0"></div><div><label>معرف الشريك</label><input id="partnerId" dir="ltr"></div></div><div class="row"><div><label>الخصم المتوقع</label><input id="expectedDiscount" type="number" min="0" value="0"></div><div><label>الخصم المطبق</label><input id="appliedDiscount" type="number" min="0" value="0"></div></div><label>تفاصيل الشكوى</label><textarea id="complaintNote"></textarea><button class="btn" onclick="createComplaint()">فتح تذكرة</button></section>
  <section id="staff" class="panel"><h2>اعتماد طلب موظف وارد من واتساب</h2><p class="muted">لا تسجل الطلب إلا بعد مطابقة رقم المرسل على واتساب مع الرقم المكتوب.</p><div class="row"><div><label>كود الطلب</label><input id="staffCode" placeholder="OVS-XXXXXXXX" dir="ltr"></div><div><label>الاسم</label><input id="staffName"></div></div><label>بريد/هوية Cloudflare</label><input id="staffEmail" type="email" dir="ltr"><div class="row"><div><label>الموبايل</label><input id="staffPhone" dir="ltr"></div><div><label>واتساب</label><input id="staffWhatsapp" dir="ltr"></div></div><label>الدور المطلوب</label><select id="staffRole"><option value="CARD_ISSUER">إصدار الكروت</option><option value="BRANCH_STAFF">موظف فرع</option><option value="PARTNER_MANAGER">مسؤول شركاء</option><option value="SUPPORT">دعم العملاء</option><option value="REVIEWER">مراجع</option></select><button class="btn" onclick="confirmEnrollment()">تسجيل مطابقة واتساب</button><div id="staffPending" class="result"></div></section>

  <script>
    const $=id=>document.getElementById(id); let bootstrap=null;
    document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-tab],.panel').forEach(x=>x.classList.remove('active'));button.classList.add('active');$(button.dataset.tab).classList.add('active')}));
    function value(id){return $(id).value.trim()} function busy(on){document.body.classList.toggle('loading',on)} function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function notify(text,kind='info'){const box=$('notice');box.textContent=text;box.className='notice show '+kind;setTimeout(()=>box.classList.remove('show'),6500)}
    function run(name,args,onSuccess){busy(true);google.script.run.withSuccessHandler(result=>{busy(false);onSuccess&&onSuccess(result)}).withFailureHandler(error=>{busy(false);notify(error.message||String(error),'err')})[name](args)}
    function testQr(serial,target){const payload='OMRAN-VIP-TEST|'+serial;const src='https://quickchart.io/qr?size=260&margin=2&text='+encodeURIComponent(payload);target.innerHTML='<strong>تم الإصدار.</strong><br>السيريال: '+esc(serial)+'<img class="qr" alt="QR تجريبي" src="'+esc(src)+'"><p class="muted">QR تجريبي لا يحتوي رمز التحقق الحقيقي وغير صالح للبيع أو الخصم.</p>'}
    function issueCard(){run('issueVipCard',{subscriberId:value('issueSubscriber'),cardTypeId:value('issueType')},r=>{testQr(r.serialNumber,$('issueResult'));notify('تم إصدار الكارت بحالة NEW','ok')})}
    function activateCard(){run('activateVipCard',{cardId:value('activateCard'),paymentReference:value('paymentRef')},()=>notify('تم تفعيل الكارت','ok'))}
    function searchCards(){run('searchVipCards',value('searchQuery'),rows=>{$('searchResult').innerHTML=rows.length?rows.map(r=>'<div class="card"><strong>'+esc(r.serialNumber)+'</strong><br>'+esc(r.status)+' — '+esc(r.cardTypeId)+'<br>'+esc(r.phone)+'<br><span class="muted">'+esc(r.cardId)+'</span></div>').join(''):'لا توجد نتائج'})}
    function suspendCard(){run('suspendVipCard',{cardId:value('actionCard'),reason:value('actionReason')},()=>notify('تم إيقاف الكارت وتسجيل السبب','ok'))}
    function replaceCard(){run('replaceVipCard',{cardId:value('actionCard'),reason:value('actionReason'),feePiasters:Number(value('replacementFee')||0)},r=>{testQr(r.serialNumber,$('replaceResult'));notify('تم إبطال الكارت القديم وإصدار البديل','ok')})}
    function createComplaint(){run('createVipComplaint',{contactPhone:value('complaintPhone'),cardId:value('complaintCard'),partnerId:value('partnerId'),invoicePiasters:Number(value('invoiceValue')||0),expectedDiscountPiasters:Number(value('expectedDiscount')||0),appliedDiscountPiasters:Number(value('appliedDiscount')||0),note:value('complaintNote')},r=>notify('تم فتح التذكرة '+r.ticketNumber,'ok'))}
    function confirmEnrollment(){run('registerVipStaffEnrollment',{requestCode:value('staffCode'),displayName:value('staffName'),identityEmail:value('staffEmail'),phone:value('staffPhone'),whatsapp:value('staffWhatsapp'),requestedRole:value('staffRole')},()=>loadBootstrap())}
    function approveEnrollment(id){run('approveVipStaffEnrollment',{enrollmentId:id},r=>{notify('تم اعتماد الموظف. أضف بريده الآن إلى Cloudflare Access.','ok');loadBootstrap()})}
    function renderPending(){const box=$('staffPending');if(!bootstrap.pendingEnrollments.length){box.textContent='لا توجد طلبات جاهزة للاعتماد';return}box.innerHTML=bootstrap.pendingEnrollments.map(x=>'<div class="card"><strong>'+esc(x.name)+'</strong><br>'+esc(x.email)+' — '+esc(x.role)+'<br>'+esc(x.code)+' — '+esc(x.status)+(x.status==='WHATSAPP_CONFIRMED'?'<button class="btn" data-approve="'+esc(x.id)+'">اعتماد الموظف</button>':'')+'</div>').join('');box.querySelectorAll('[data-approve]').forEach(button=>button.addEventListener('click',()=>approveEnrollment(button.dataset.approve)))}
    function loadBootstrap(){run('getVipStaffConsoleBootstrap',null,r=>{bootstrap=r;$('actor').textContent=r.actor.identity+' — '+r.actor.role;$('financial').className='pill '+(r.financialEnabled?'on':'off');$('financial').textContent=r.financialEnabled?'التشغيل المالي فعال':'التشغيل المالي مقفول';$('verification').className='pill '+(r.publicVerificationEnabled?'on':'off');$('verification').textContent=r.publicVerificationEnabled?'التحقق العام فعال':'التحقق العام مقفول';$('issueType').innerHTML=r.cardTypes.map(t=>'<option value="'+esc(t.id)+'" '+(t.status==='DRAFT'?'disabled':'')+'>'+esc(t.name)+' — '+esc(t.status)+'</option>').join('');renderPending()})}
    loadBootstrap();
  </script>
</body>
</html>
