# =============================================================================
# Cloudflare Tunnel — origin-only ingress for Omran Store backend
# =============================================================================
#
# Public storefront ownership belongs exclusively to Cloudflare Pages:
#   omrantoys.store
#   www.omrantoys.store
#
# The Tunnel must therefore expose the backend on a dedicated hostname that is
# never covered by the storefront Worker routes:
#   origin.omrantoys.store -> http://store:3000
#
# This file is for locally-managed cloudflared. If production uses a remotely
# managed Tunnel (token mode), configure the exact same public hostname/service
# mapping in Cloudflare Zero Trust instead.
# =============================================================================

tunnel: omran-store-live
credentials-file: /etc/cloudflared/creds/REPLACE_WITH_TUNNEL_ID.json

ingress:
  - hostname: origin.omrantoys.store
    service: http://store:3000

  # Required catch-all. Never forward unknown hostnames to the admin backend.
  - service: http_status:404

metrics: 127.0.0.1:20241
origin_request:
  connect_timeout: 3s
  tcp_keep_alive: 30s
no_tls_verify: false
