# نشر تلقائي: GitHub → Cloudflare → omrantoys.store
# كل push إلى main يبني الواجهة وينشر الـWorker + الأصول الثابتة على Cloudflare.
# المتطلبات (تُضاف مرة واحدة في GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — توكن بصلاحية "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  — من لوحة تحكم Cloudflare (Workers & Pages → Account ID)
# توكنات Meta (المزامنة) لا تمر من هنا إطلاقًا؛ تُخزَّن كأسرار Worker عبر:
#   wrangler secret put INSTAGRAM_ACCESS_TOKEN
#   wrangler secret put FACEBOOK_PAGE_ID
#   wrangler secret put FACEBOOK_PAGE_ACCESS_TOKEN

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type checks
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build client (Workers Assets payload)
        run: pnpm exec vite build

      - name: Deploy Worker + Assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
