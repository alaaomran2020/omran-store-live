# نشر آمن: GitHub → Cloudflare Workers Assets → https://omrantoys.store
#
# القيم السرية لا تُكتب هنا ولا في أي ملف. تُقرأ وقت التشغيل فقط من
# GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   — توكن بصلاحية Edit Cloudflare Workers
#   CLOUDFLARE_ACCOUNT_ID  — Account ID من لوحة Cloudflare (Workers & Pages)
#
# توكنات Meta لا تمر من هذا الـWorkflow؛ تُخزَّن كأسرار Worker:
#   wrangler secret put INSTAGRAM_ACCESS_TOKEN
#   wrangler secret put FACEBOOK_PAGE_ID
#   wrangler secret put FACEBOOK_PAGE_ACCESS_TOKEN

name: Deploy to Cloudflare

on:
  # تشغيل يدوي من تبويب Actions (المسار الآمن للتحقق قبل تعويد الدفع التلقائي)
  workflow_dispatch:
  # بعد نجاح الدمج إلى main: اختبارات ثم نشر ثم فحص الموقع
  push:
    branches: [main]

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://omrantoys.store
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type checks
        run: pnpm check

      - name: Tests
        run: pnpm test

  deploy:
    name: Build, deploy, smoke-check
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo '::error::GitHub secret CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions. Do not put the value in the repo.'
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo '::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings → Secrets and variables → Actions. Do not put the value in the repo.'
            missing=1
          fi
          exit "${missing}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client (Workers Assets payload)
        run: pnpm exec vite build

      - name: Confirm assets exist
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          test -d dist/public/assets
          ls -lh dist/public dist/public/assets

      - name: Deploy Worker + Assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-check live site
        env:
          SITE_URL: ${{ env.SITE_URL }}
        run: |
          set -euo pipefail
          echo "Checking ${SITE_URL} after deploy"

          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors --max-time 25 \
            -o /tmp/home.html "${SITE_URL}/"
          grep -qiE '<html|<!doctype html' /tmp/home.html
          echo "Homepage OK ($(wc -c < /tmp/home.html) bytes)"

          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors --max-time 25 \
            -o /tmp/products.html "${SITE_URL}/products"
          grep -qiE '<html|<!doctype html' /tmp/products.html
          echo "Products page OK ($(wc -c < /tmp/products.html) bytes)"

          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors --max-time 25 \
            -D /tmp/products.hdr -o /tmp/products.json "${SITE_URL}/api/products"
          python3 -c 'import json; d=json.load(open("/tmp/products.json")); assert isinstance(d.get("products"), list), d; print("API /api/products OK status=%r count=%s" % (d.get("status"), len(d["products"])))'
          grep -i 'x-edge: *omran-store-live' /tmp/products.hdr
          echo "Edge header OK"
          echo "Live site smoke-check passed"
