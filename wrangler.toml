#:schema node_modules/wrangler/config-schema.json
# =============================================================================
# Omran Store Live — Product Engine / edge API
#
# Target split during storefront migration:
#   omrantoys.store/*              -> existing edge app (rollback-safe apex)
#   www.omrantoys.store/*          -> Cloudflare Pages storefront
#   www.omrantoys.store/api/products -> this Product Engine worker
#
# This intentionally removes the broad www wildcard from this Worker. Pages owns
# the www HTML/assets while the more-specific /api/products route keeps the
# Storefront's same-origin Product Engine contract alive.
# =============================================================================

name = "omran-store-live-edge"
main = "worker/index.ts"

routes = [
  { pattern = "omrantoys.store/*", zone_name = "omrantoys.store" },
  { pattern = "www.omrantoys.store/api/products", zone_name = "omrantoys.store" },
  { pattern = "www.omrantoys.store/edge-api/products", zone_name = "omrantoys.store" },
]

compatibility_date = "2024-09-01"
compatibility_flags = []

[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

run_worker_first = [
  "/api/*",
  "/edge-api/products",
  "/manus-storage/*",
  "/",
  "/health",
  "/robots.txt",
  "/sitemap.xml",
  "/products",
  "/products/*",
  "/categories/*",
  "/admin",
  "/admin/*",
  "/settings/*",
]

[vars]
PRODUCTS_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTLph4MyfmoeWcjJ3cMi-iDaM3dgt4_S57SvKr6wpQu8IbDKliduguIcvtp7E5o0ZoxN3ouNQoZo7dn/pub?gid=57015348&single=true&output=csv"
ORIGIN_BASE_URL = "https://origin.omrantoys.store"
MAX_BODY_BYTES = "1048576"
ORIGIN_TIMEOUT_MS = "30000"
