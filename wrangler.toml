#:schema node_modules/wrangler/config-schema.json

# =============================================================================
# Omran Store Live — Backend / Edge API only
# =============================================================================
#
# Production ownership:
#   omrantoys.store/*      -> Cloudflare Pages: omrantoys-live-app
#   www.omrantoys.store/*  -> Cloudflare Pages: omrantoys-live-app
#
# This Worker owns API traffic only. Never add a broad storefront route such as:
#   omrantoys.store/*
#   www.omrantoys.store/*
# =============================================================================

name = "omran-store-live-edge"
main = "worker/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = []

# API-only zone routes. Both hostnames reach the same Worker implementation.
routes = [
  { pattern = "omrantoys.store/api/*", zone_name = "omrantoys.store" },
  { pattern = "www.omrantoys.store/api/*", zone_name = "omrantoys.store" },
  { pattern = "omrantoys.store/edge-api/products", zone_name = "omrantoys.store" },
  { pattern = "www.omrantoys.store/edge-api/products", zone_name = "omrantoys.store" },
]

# Public runtime configuration only. Secrets stay in Cloudflare/GitHub secret stores.
[vars]
PRODUCTS_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTLph4MyfmoeWcjJ3cMi-iDaM3dgt4_S57SvKr6wpQu8IbDKliduguIcvtp7E5o0ZoxN3ouNQoZo7dn/pub?gid=57015348&single=true&output=csv"
ORIGIN_BASE_URL = "https://origin.omrantoys.store"
MAX_BODY_BYTES = "1048576"
ORIGIN_TIMEOUT_MS = "30000"
