name: Audit Google Sheets vs GitHub catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only Google authentication library
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2,<3'
      - name: Compare Sheets with repository catalog (no writes)
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: 1R-6wcwy5KWXY1uznNVCx6MB4vB0JTS3omGinEJA7tCc
        run: python scripts/audit-sheets-catalog.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-audit-report
          path: catalog-audit-report.md
          if-no-files-found: warn
          retention-days: 14
