name: Deploy Edge API to Cloudflare

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: omran-edge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://omrantoys.store
  WWW_URL: https://www.omrantoys.store
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type checks
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker configuration
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/wrangler-dry-run

      - name: Assert API-only Worker routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('wrangler.toml').read_text(encoding='utf-8')
          required = [
              'omrantoys.store/api/*',
              'www.omrantoys.store/api/*',
              'omrantoys.store/edge-api/products',
              'www.omrantoys.store/edge-api/products',
          ]
          for route in required:
              assert route in text, f'missing required route: {route}'
          forbidden = [
              '{ pattern = "omrantoys.store/*"',
              '{ pattern = "www.omrantoys.store/*"',
              '[assets]',
          ]
          for token in forbidden:
              assert token not in text, f'forbidden storefront ownership in Worker config: {token}'
          print('API-only Worker configuration: PASS')
          PY

  deploy:
    name: Deploy Worker and verify production APIs
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo '::error::CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }
          echo 'Required Cloudflare secret names are configured.'

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Deploy API Worker only
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production APIs without misclassifying Cloudflare challenges
        env:
          SITE_URL: ${{ env.SITE_URL }}
          WWW_URL: ${{ env.WWW_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          challenge_count=0

          probe_products() {
            local label="$1"
            local base="$2"
            local output="$3"
            local url="${base}/api/products"
            local body headers status attempt
            local saw_challenge=0

            body="$(mktemp)"
            headers="$(mktemp)"

            for attempt in $(seq 1 6); do
              status="$(curl -sS --connect-timeout 10 --max-time 30                 -A 'Mozilla/5.0 (compatible; OmranToys-CI/1.0)'                 -H 'accept: application/json'                 -D "${headers}" -o "${body}" -w '%{http_code}'                 "${url}?ci_run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" || true)"

              if [ "${status}" = '200' ]; then
                python3 - "${body}" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('status') == 'ok', (
              f"status must be ok, got {data.get('status')!r}"
          )
          products = data.get('products')
          assert isinstance(products, list), 'products must be a list'

          bad = []
          for product in products:
              if not (
                  product.get('active') is True
                  and product.get('workflowStatus') == 'PUBLISHED'
                  and product.get('qaStatus') == 'PASS'
              ):
                  bad.append(
                      product.get('id')
                      or product.get('product_id')
                      or '<unknown>'
                  )

          assert not bad, f'publication gate violation: {bad}'
          print(f'Product API publication gate: PASS ({len(products)} products)')
          PY
                cp "${body}" "${output}"
                echo "${label}: Product API verified successfully."
                return 0
              fi

              if [ "${status}" = '403' ]                 && grep -qi '^cf-mitigated:[[:space:]]*challenge' "${headers}"; then
                saw_challenge=1
                echo "::warning::${label} was blocked by a Cloudflare managed challenge; attempt ${attempt}/6."
                sleep 5
                continue
              fi

              echo "${label}: attempt ${attempt}/6 returned ${status:-transport_error}."
              sleep 5
            done

            if [ "${saw_challenge}" -eq 1 ]; then
              challenge_count=$((challenge_count + 1))
              echo "::warning::${label} production validation is INCONCLUSIVE because Cloudflare challenged the GitHub-hosted runner. This is not recorded as application success."
              return 0
            fi

            echo "::error::${label} Product API could not be verified."
            cat "${headers}"
            head -c 1000 "${body}" || true
            exit 1
          }

          probe_unauthorized() {
            local base="$1"
            local path="$2"
            local body headers status attempt
            local saw_challenge=0

            body="$(mktemp)"
            headers="$(mktemp)"

            for attempt in $(seq 1 4); do
              status="$(curl -sS --connect-timeout 10 --max-time 30                 -A 'Mozilla/5.0 (compatible; OmranToys-CI/1.0)'                 -H 'accept: application/json'                 -D "${headers}" -o "${body}" -w '%{http_code}'                 "${base}${path}?ci_run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" || true)"

              if [ "${status}" = '401' ] || [ "${status}" = '403' ]; then
                if grep -qi '^cf-mitigated:[[:space:]]*challenge' "${headers}"; then
                  saw_challenge=1
                  echo "::warning::${path} received a Cloudflare challenge; attempt ${attempt}/4."
                  sleep 5
                  continue
                fi

                grep -qi '^content-type:.*application/json' "${headers}" || {
                  echo "::error::${path} returned ${status} but not JSON."
                  cat "${headers}"
                  exit 1
                }
                echo "${path}: unauthorized contract verified (${status}, JSON)."
                return 0
              fi

              if [ "${status}" = '530' ] || [ "${status}" = '502' ] || [ "${status}" = '504' ]; then
                echo "::error::${path} origin is unavailable (${status})."
                head -c 1000 "${body}" || true
                exit 1
              fi

              echo "${path}: attempt ${attempt}/4 returned ${status:-transport_error}."
              sleep 5
            done

            if [ "${saw_challenge}" -eq 1 ]; then
              challenge_count=$((challenge_count + 1))
              echo "::warning::${path} validation is INCONCLUSIVE because Cloudflare challenged the GitHub-hosted runner."
              return 0
            fi

            echo "::error::${path} did not return the expected unauthorized JSON contract."
            exit 1
          }

          probe_products "Apex" "${SITE_URL}" /tmp/apex-products.json
          probe_products "www" "${WWW_URL}" /tmp/www-products.json

          if [ -f /tmp/apex-products.json ] && [ -f /tmp/www-products.json ]; then
            python3 - <<'PY'
          import json

          apex = json.load(
              open('/tmp/apex-products.json', encoding='utf-8')
          )['products']
          www = json.load(
              open('/tmp/www-products.json', encoding='utf-8')
          )['products']

          ids = lambda products: [
              product.get('id') or product.get('product_id')
              for product in products
          ]

          assert ids(apex) == ids(www), (
              f'apex/www product IDs differ: {ids(apex)} != {ids(www)}'
          )
          print('Apex/www Product API parity: PASS')
          PY
          else
            echo "::warning::Product parity was not claimed because at least one hostname was challenged."
          fi

          probe_unauthorized "${SITE_URL}" /api/admin/auth/me
          probe_unauthorized "${SITE_URL}" /api/leads

          if [ "${challenge_count}" -gt 0 ]; then
            echo "::warning::${challenge_count} production probe(s) were inconclusive due to explicit cf-mitigated: challenge responses."
            echo "### Production verification: INCONCLUSIVE" >> "${GITHUB_STEP_SUMMARY}"
            echo "Cloudflare challenged the GitHub-hosted runner. Deployment was accepted, but application success was not claimed. External production monitoring must remain green." >> "${GITHUB_STEP_SUMMARY}"

            # Confirm that Cloudflare accepted and registered the deployment.
            # This is deployment evidence only; it does not replace application probes.
            pnpm exec wrangler deployments list
          else
            echo "### Production verification: PASS" >> "${GITHUB_STEP_SUMMARY}"
            echo "Product publication gate, apex/www parity and unauthorized API contracts passed." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Report deployment
        run: |
          echo "Worker: omran-store-live-edge"
          echo "Commit: ${GITHUB_SHA}"
          echo "Production API: ${SITE_URL}/api/products"
