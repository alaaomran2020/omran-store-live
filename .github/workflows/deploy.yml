# نشر آمن: GitHub → Cloudflare Workers Assets → https://omrantoys.store
#
# القيم السرية لا تُكتب هنا ولا في أي ملف. تُقرأ وقت التشغيل فقط من:
# GitHub → Settings → Secrets and variables → Actions
#
# الأسرار المطلوبة:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# توكنات Meta لا تمر عبر هذا الـWorkflow، بل تُخزَّن كأسرار داخل Worker:
#   wrangler secret put INSTAGRAM_ACCESS_TOKEN
#   wrangler secret put FACEBOOK_PAGE_ID
#   wrangler secret put FACEBOOK_PAGE_ACCESS_TOKEN

name: Deploy to Cloudflare

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_URL: https://omrantoys.store
  WWW_URL: https://www.omrantoys.store
  PRODUCTION_URL: https://omrantoys.store
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  ci:
    name: CI — lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Type checks
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build client assets
        run: pnpm exec vite build

      - name: Confirm build assets exist
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          test -d dist/public/assets
          echo "Build assets are ready."
          ls -lh dist/public
          ls -lh dist/public/assets

  # Backwards compatibility: keep job id "test" as alias for required checks
  test:
    name: Typecheck and tests (alias)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI already passed in job 'ci'"

  deploy:
    name: Build, deploy and smoke-check
    needs: ci
    # Deploy فقط عند push إلى main أو تشغيل يدوي، لا عند Pull Request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is not configured."
            missing=1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is not configured."
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            echo "::error::Add the missing secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "Required Cloudflare secrets are configured."

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build client assets
        run: pnpm exec vite build

      - name: Confirm build assets exist
        run: |
          set -euo pipefail

          test -f dist/public/index.html
          test -d dist/public/assets

          echo "Build assets are ready."
          ls -lh dist/public
          ls -lh dist/public/assets

      - name: Deploy Worker and assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-check production domains
        env:
          SITE_URL: ${{ env.SITE_URL }}
          WWW_URL: ${{ env.WWW_URL }}
        run: |
          set -euo pipefail

          # Cloudflare may intentionally return 403 to GitHub-hosted runner IPs
          # before a request reaches the Worker. That must not be confused with
          # an origin outage. A Cloudflare-authenticated 403 proves DNS + TLS +
          # edge reachability; 522 and every other unexpected status still fail.
          probe() {
            local name="$1"
            local url="$2"
            local body="$3"
            local headers="$4"
            local expected="$5"
            local status=""

            for attempt in $(seq 1 12); do
              status="$(
                curl \
                  -sS \
                  -L \
                  --connect-timeout 10 \
                  --max-time 25 \
                  -D "${headers}" \
                  -o "${body}" \
                  -w '%{http_code}' \
                  "${url}" || true
              )"

              if [ "${status}" = "200" ] || [ "${status}" = "403" ]; then
                break
              fi

              echo "${name}: attempt ${attempt}/12 returned ${status:-transport_error}; retrying."
              sleep 5
            done

            if [ "${status}" = "403" ]; then
              if ! grep -qiE '^server:[[:space:]]*cloudflare' "${headers}"; then
                echo "::error::${name} returned a non-Cloudflare 403."
                return 1
              fi

              echo "::warning::${name} is reachable through Cloudflare, but Cloudflare security denied this GitHub runner (403)."
              return 0
            fi

            if [ "${status}" != "200" ]; then
              echo "::error::${name} returned unexpected status ${status:-transport_error}."
              return 1
            fi

            case "${expected}" in
              html)
                grep -qiE '<html|<!doctype html' "${body}"
                ;;
              products-json)
                python3 - "${body}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              data = json.load(file)

          products = data.get("products")
          assert isinstance(products, list), (
              "The API response does not contain a products list."
          )
          print(
              "API /api/products OK:",
              f"status={data.get('status')!r}",
              f"count={len(products)}",
          )
          PY
                ;;
              *)
                echo "::error::Unknown probe expectation: ${expected}"
                return 1
                ;;
            esac

            echo "${name} OK (200, $(wc -c < "${body}") bytes)."
          }

          echo "Checking real production hostnames after deployment."
          probe "Apex homepage" "${SITE_URL}/" /tmp/home.html /tmp/home.hdr html
          probe "Products page" "${SITE_URL}/products" /tmp/products.html /tmp/products-page.hdr html
          probe "Products API" "${SITE_URL}/api/products" /tmp/products.json /tmp/products-api.hdr products-json
          probe "www homepage" "${WWW_URL}/" /tmp/www-home.html /tmp/www-home.hdr html

          echo "Production-domain smoke-check passed."

      - name: Report production URL
        run: |
          echo "Deployment completed successfully."
          echo "Production site: ${PRODUCTION_URL}"
