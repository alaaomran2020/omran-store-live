name: Deploy Edge API to Cloudflare

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: omran-edge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://omrantoys.store
  WWW_URL: https://www.omrantoys.store
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type checks
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker configuration
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/wrangler-dry-run

      - name: Assert API-only Worker routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('wrangler.toml').read_text(encoding='utf-8')
          required = [
              'omrantoys.store/api/*',
              'www.omrantoys.store/api/*',
              'omrantoys.store/edge-api/products',
              'www.omrantoys.store/edge-api/products',
          ]
          for route in required:
              assert route in text, f'missing required route: {route}'
          forbidden = [
              '{ pattern = "omrantoys.store/*"',
              '{ pattern = "www.omrantoys.store/*"',
              '[assets]',
          ]
          for token in forbidden:
              assert token not in text, f'forbidden storefront ownership in Worker config: {token}'
          print('API-only Worker configuration: PASS')
          PY

  deploy:
    name: Deploy Worker and verify production APIs
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo '::error::CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }
          echo 'Required Cloudflare secret names are configured.'

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Deploy API Worker only
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production Product API on apex and www
        env:
          SITE_URL: ${{ env.SITE_URL }}
          WWW_URL: ${{ env.WWW_URL }}
        run: |
          set -euo pipefail
          for base in "${SITE_URL}" "${WWW_URL}"; do
            url="${base}/api/products"
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl -sS --connect-timeout 10 --max-time 30 -D "${headers}" -o "${body}" -w '%{http_code}' "${url}")"
            test "${status}" = '200' || { echo "::error::${url} returned ${status}; expected 200"; cat "${headers}"; exit 1; }
            python3 - "${body}" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('status') == 'ok', f"status must be ok, got {data.get('status')!r}"
          products = data.get('products')
          assert isinstance(products, list), 'products must be a list'
          bad = []
          for p in products:
              if not (
                  p.get('active') is True
                  and p.get('workflowStatus') == 'PUBLISHED'
                  and p.get('qaStatus') == 'PASS'
              ):
                  bad.append(p.get('id') or p.get('product_id') or '<unknown>')
          assert not bad, f'publication gate violation: {bad}'
          print(f'Product API publication gate: PASS ({len(products)} products)')
          PY
          done

      - name: Verify apex and www Product IDs are identical
        env:
          SITE_URL: ${{ env.SITE_URL }}
          WWW_URL: ${{ env.WWW_URL }}
        run: |
          set -euo pipefail
          curl -fsS "${SITE_URL}/api/products" -o /tmp/apex-products.json
          curl -fsS "${WWW_URL}/api/products" -o /tmp/www-products.json
          python3 - <<'PY'
          import json
          a = json.load(open('/tmp/apex-products.json', encoding='utf-8'))['products']
          w = json.load(open('/tmp/www-products.json', encoding='utf-8'))['products']
          ids = lambda xs: [p.get('id') or p.get('product_id') for p in xs]
          assert ids(a) == ids(w), f'apex/www product IDs differ: {ids(a)} != {ids(w)}'
          print('Apex/www Product API parity: PASS')
          PY

      - name: Verify unauthorized Admin and Leads never return 530/HTML
        env:
          SITE_URL: ${{ env.SITE_URL }}
        run: |
          set -euo pipefail
          for path in /api/admin/auth/me /api/leads; do
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl -sS --connect-timeout 10 --max-time 30 -D "${headers}" -o "${body}" -w '%{http_code}' "${SITE_URL}${path}")"
            if [ "${status}" = '530' ] || [ "${status}" = '502' ] || [ "${status}" = '504' ]; then
              echo "::error::${path} origin is unavailable (${status})"
              cat "${body}"
              exit 1
            fi
            case "${status}" in 401|403) ;; *) echo "::error::${path} returned ${status}; expected 401 or 403"; cat "${body}"; exit 1;; esac
            grep -qi '^content-type:.*application/json' "${headers}" || { echo "::error::${path} did not return JSON"; cat "${headers}"; exit 1; }
          done

      - name: Report deployment
        run: |
          echo "Worker: omran-store-live-edge"
          echo "Commit: ${GITHUB_SHA}"
          echo "Production API: ${SITE_URL}/api/products"
