name: Omran Master Data Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/master-data-pipeline.mjs"
      - ".github/workflows/master-data-pipeline.yml"
      - "docs/MASTER-SCHEMA-V1.md"
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: omran-master-data-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  OMRAN_SHEET_ID: 1R-6wcwy5KWXY1uznNVCx6MB4vB0JTS3omGinEJA7tCc
  MAX_AI_PRODUCTS: ${{ github.event_name == 'pull_request' && '1' || '10' }}
  GEMINI_MODEL: gemini-3.8-flash

jobs:
  sync-enrich-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo '::error::Missing GEMINI_API_KEY'; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo '::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON'; exit 1; }

      - name: Enrich products and rebuild approved catalog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/master-data-pipeline.mjs

      - name: Validate generated catalog
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const csv = readFileSync('public/catalog/products.csv', 'utf8').trim();
          const lines = csv.split(/\r?\n/);
          if (lines.length < 2) throw new Error('Generated catalog has no public products');
          if (!lines[0].includes('workflow_status') || !lines[0].includes('qa_status')) throw new Error('Catalog schema guard failed');
          console.log(`Catalog validation PASS: ${lines.length - 1} rows`);
          NODE

      - name: Commit catalog changes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- public/catalog/products.csv; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "omran-automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/catalog/products.csv
          git commit -m "chore(catalog): sync approved products from Master Schema v1"
          git push
