name: OMRAN Offline Editor QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/offline-product-editor/**'
      - '.github/workflows/offline-product-editor-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test local offline editor
        run: node --test tools/offline-product-editor/editor.test.cjs
      - name: Assert no deploy command in this workflow
        shell: bash
        run: |
          set -euo pipefail
          if grep -E 'wrangler[[:space:]]+(deploy|pages[[:space:]]+deploy)' .github/workflows/offline-product-editor-check.yml; then
            echo '::error::Offline editor workflow must not deploy'; exit 1
          fi
