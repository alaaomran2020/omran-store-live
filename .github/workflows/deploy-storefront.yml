name: Deploy Storefront to Cloudflare Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "client/**"
      - "public/**"
      - "shared/**"
      - "scripts/**"
      - ".env.production"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-storefront.yml"

concurrency:
  group: omran-storefront-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  LIVE_PRODUCTS_SHEET_URL: https://script.google.com/macros/s/AKfycbxRXUDx4gJh-RyLB19D3y6-6lnaoNBndypji02qXk1tkDyHleufdz-WUpKlymkcPYxOwQ/exec?action=catalog
  FALLBACK_PRODUCTS_SHEET_URL: https://raw.githubusercontent.com/alaaomran2020/omran-store-live/${{ github.sha }}/public/catalog/products.csv

jobs:
  validate-storefront:
    name: Validate storefront integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select live catalog source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          if curl -fsSL --max-time 20 "$LIVE_PRODUCTS_SHEET_URL" -o "$tmp" && head -n 1 "$tmp" | grep -q '^id,name,price,category,'; then
            echo "PRODUCTS_SHEET_URL=$LIVE_PRODUCTS_SHEET_URL" >> "$GITHUB_ENV"
            echo "Catalog source: Apps Script live feed"
          else
            echo "PRODUCTS_SHEET_URL=$FALLBACK_PRODUCTS_SHEET_URL" >> "$GITHUB_ENV"
            echo "::warning::Apps Script catalog feed not ready; using repository fallback"
          fi
          rm -f "$tmp"

      - name: Generate approved public catalog snapshot
        run: |
          pnpm exec esbuild scripts/generate-public-products-snapshot.ts --bundle --platform=node --format=esm --outfile=/tmp/generate-public-products-snapshot.mjs
          node /tmp/generate-public-products-snapshot.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('client/src/lib/publicProductsSnapshot.ts').read_text(encoding='utf-8')
          ids = re.findall(r'^\s*(?:"id"|id):\s*"([^"]+)"', source, flags=re.MULTILINE)
          assert len(ids) >= 1, 'catalog generation produced no approved public products'
          assert len(ids) == len(set(ids)), f'duplicate snapshot product IDs: {ids}'
          print(f'Catalog generation guard: PASS ({len(ids)} approved products)')
          PY

      - name: Repository integration audit
        run: node scripts/integration-audit.mjs

      - name: Quality gates
        run: |
          pnpm lint
          pnpm check
          pnpm test

      - name: Build storefront
        run: pnpm build

      - name: Assert verified catalog and images are bundled
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('client/src/lib/publicProductsSnapshot.ts').read_text(encoding='utf-8')
          product_ids = re.findall(r'^\s*(?:"id"|id):\s*"([^"]+)"', source, flags=re.MULTILINE)
          images = re.findall(r'^\s*(?:"image"|image):\s*"([^"]+)"', source, flags=re.MULTILINE)
          assert len(product_ids) >= 1, 'catalog bundle contains no approved public products'
          assert len(product_ids) == len(set(product_ids)), f'duplicate snapshot product IDs: {product_ids}'
          assert len(images) == len(product_ids), f'image/product mismatch: {len(images)} / {len(product_ids)}'
          remote_images = [image for image in images if not image.startswith('/products/processed/')]
          assert not remote_images, f'public products still depend on remote image URLs: {remote_images}'
          missing_images = []
          for image in images:
              path = Path('dist/public') / image.lstrip('/')
              if not path.is_file() or path.stat().st_size < 1024:
                  missing_images.append(image)
          assert not missing_images, f'missing/invalid product image assets: {missing_images}'
          assets = Path('dist/public/assets')
          built_text = '\n'.join(p.read_text(encoding='utf-8', errors='ignore') for p in assets.rglob('*') if p.is_file())
          missing_products = [product_id for product_id in product_ids if product_id not in built_text]
          assert not missing_products, f'missing verified products in storefront bundle: {missing_products}'
          print(f'Storefront bundle: PASS ({len(product_ids)} verified products, {len(images)} same-origin images)')
          PY

      - name: Record validated catalog provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-inputs
          cp client/src/lib/publicProductsSnapshot.ts release-inputs/publicProductsSnapshot.ts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re

          source = Path('release-inputs/publicProductsSnapshot.ts').read_bytes()
          text = source.decode('utf-8')
          ids = re.findall(r'^\s*(?:"id"|id):\s*"([^"]+)"', text, flags=re.MULTILINE)
          source_url = os.environ.get('PRODUCTS_SHEET_URL', '')
          selected_source = 'live-feed' if source_url == os.environ.get('LIVE_PRODUCTS_SHEET_URL', '') else 'repository-fallback'
          provenance = [
              f'source={selected_source}',
              f'source_url={source_url}',
              f'snapshot_sha256={hashlib.sha256(source).hexdigest()}',
              f'approved_product_count={len(ids)}',
              f'commit={os.environ.get("GITHUB_SHA", "")}',
          ]
          Path('release-inputs/catalog-provenance.txt').write_text('\\n'.join(provenance) + '\\n', encoding='utf-8')
          print('\\n'.join(provenance))
          PY

      - name: Stage build-generated media for the deploy job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-inputs
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          # A validated snapshot may reference a same-origin asset that snapshot
          # generation downloaded for a remote-only product. Such a file is not
          # tracked by Git, so the deploy job's fresh checkout cannot contain it:
          # its bytes must travel inside the validated artifact alongside the
          # snapshot that references them.
          snapshot = Path('client/src/lib/publicProductsSnapshot.ts').read_text(encoding='utf-8')
          pairs = []
          current_id = None
          for line in snapshot.splitlines():
              id_match = re.match(r'^\s*(?:"id"|id):\s*"([^"]+)"', line)
              if id_match:
                  current_id = id_match.group(1)
                  continue
              image_match = re.match(r'^\s*(?:"image"|image):\s*"([^"]+)"', line)
              if image_match and current_id:
                  pairs.append((current_id, image_match.group(1)))
                  current_id = None

          if not pairs:
              sys.exit('No approved snapshot images found to stage')

          tracked = set(
              subprocess.run(
                  ['git', 'ls-files', '-z'], check=True, capture_output=True, text=True
              ).stdout.split('\0')
          )

          manifest_lines = []
          for product_id, image in pairs:
              if not image.startswith('/') or image.startswith('//'):
                  sys.exit(f'Snapshot image is not same-origin for {product_id}: {image}')
              source = Path('public') / image.lstrip('/')
              if source.as_posix() in tracked:
                  continue  # Committed asset: present in every fresh checkout.
              if not source.is_file() or source.stat().st_size == 0:
                  sys.exit(
                      f'Snapshot references a missing/empty build-generated asset for '
                      f'{product_id}: {image}'
                  )
              target = Path('release-inputs/generated-media') / image.lstrip('/')
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              manifest_lines.append(f'{product_id}\t{image}\t{source.stat().st_size}')

          Path('release-inputs/generated-media-manifest.txt').write_text(
              ''.join(f'{line}\n' for line in manifest_lines), encoding='utf-8'
          )
          print(f'Build-generated media staged for deploy: {len(manifest_lines)} file(s)')
          for line in manifest_lines:
              print(f'  {line}')
          PY

      - name: Upload validated storefront inputs
        uses: actions/upload-artifact@v4
        with:
          name: validated-storefront-inputs
          path: release-inputs/
          if-no-files-found: error
          retention-days: 7

  deploy-storefront:
    name: Deploy storefront production
    if: github.event_name != 'pull_request'
    needs: validate-storefront
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download validated storefront inputs
        uses: actions/download-artifact@v4
        with:
          name: validated-storefront-inputs
          path: release-inputs

      - name: Restore validated catalog snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s release-inputs/publicProductsSnapshot.ts
          test -s release-inputs/catalog-provenance.txt
          cp release-inputs/publicProductsSnapshot.ts client/src/lib/publicProductsSnapshot.ts
          cat release-inputs/catalog-provenance.txt
          echo "CATALOG_SOURCE=validated-artifact" >> "$GITHUB_ENV"

      - name: Restore build-generated media assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import sys

          # Deterministic, manifest-driven restore into the source public tree so
          # the build's publicDir copy publishes the exact validated bytes.
          manifest = Path('release-inputs/generated-media-manifest.txt')
          if not manifest.is_file():
              print('Build-generated media manifest is absent: nothing to restore')
              raise SystemExit(0)

          entries = [
              line.split('\t')
              for line in manifest.read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          if not entries:
              print('Build-generated media manifest is empty: nothing to restore')
              raise SystemExit(0)

          media_root = Path('release-inputs/generated-media')
          restored = 0
          failures = []
          for entry in entries:
              product_id, image = entry[0], entry[1]
              validated_size = int(entry[2]) if len(entry) > 2 and entry[2].strip() else 0
              relative = image.lstrip('/')
              source = media_root / relative
              if not source.is_file():
                  failures.append(
                      f'MISSING product={product_id} reference={image} expected={source}'
                  )
                  continue
              actual_size = source.stat().st_size
              if actual_size == 0 or (validated_size and actual_size != validated_size):
                  failures.append(
                      f'INVALID product={product_id} reference={image} expected={source} '
                      f'(size {actual_size} != validated {validated_size})'
                  )
                  continue
              target = Path('public') / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              restored += 1

          if failures:
              print('::error::Validated build-generated media could not be restored')
              for failure in failures:
                  print(f'  {failure}')
              sys.exit(1)

          print(f'Build-generated media restore: {restored} file(s) restored into public/')
          PY

      - name: Build storefront
        run: pnpm build

      - name: Assert deployment media integrity (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          # Fail-closed gate against the ACTUAL deployment output. Every
          # same-origin image referenced by the bundled catalog must exist inside
          # dist/public before wrangler uploads that directory.
          output_root = Path('dist/public').resolve()
          specs = [
              ('toys', 'client/src/lib/publicProductsSnapshot.ts', '(?:"image"|image)', '/products/processed/'),
              ('popup', 'client/src/lib/popupProductsSnapshot.ts', 'localImage', '/products/popup/'),
          ]

          checked = 0
          remote = []
          unsafe = []
          missing = []
          empty = []
          problems = []

          for label, snapshot_path, key, prefix in specs:
              source = Path(snapshot_path).read_text(encoding='utf-8')
              found = 0
              for match in re.finditer(rf'{key}:\s*"([^"]+)"', source):
                  image = match.group(1)
                  # Pair each media reference with the nearest preceding product id.
                  # Position-based pairing stays correct regardless of line layout.
                  owner = label
                  for id_match in re.finditer(r'(?:"id"|id):\s*"([^"]+)"', source[: match.start()]):
                      owner = id_match.group(1)
                  found += 1
                  checked += 1
                  if not image.startswith(prefix):
                      remote.append((label, owner, image))
                      continue
                  resolved = (output_root / image.lstrip('/')).resolve()
                  if output_root not in resolved.parents:
                      unsafe.append((label, owner, image, str(resolved)))
                      continue
                  if not resolved.is_file():
                      missing.append((label, owner, image, str(resolved)))
                      continue
                  if resolved.stat().st_size < 1024:
                      empty.append((label, owner, image, resolved.stat().st_size))
                      continue
              if found == 0:
                  problems.append(
                      f'{label}: no image references parsed from {snapshot_path} '
                      f'(the gate must not be a silent no-op)'
                  )

          if remote or unsafe or missing or empty or problems:
              print('::error::Deployment media integrity gate FAILED - refusing to deploy')
              for label, owner, image in remote:
                  print(f'  REMOTE_REFERENCE catalog={label} product={owner} reference={image}')
              for label, owner, image, path in unsafe:
                  print(f'  UNSAFE_PATH catalog={label} product={owner} reference={image} expected={path}')
              for label, owner, image, path in missing:
                  print(f'  MISSING_ASSET catalog={label} product={owner} reference={image} expected={path}')
              for label, owner, image, size in empty:
                  print(f'  EMPTY_ASSET catalog={label} product={owner} reference={image} size={size}')
              for problem in problems:
                  print(f'  SNAPSHOT_PARSE {problem}')
              sys.exit(1)

          print(f'Deployment media integrity gate: PASS ({checked} snapshot images verified in dist/public)')
          PY

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }

      - name: Deploy Cloudflare Pages production
        run: pnpm exec wrangler pages deploy dist/public --project-name=omrantoys-live-app --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production sitemap is real XML
        shell: bash
        run: |
          set -euo pipefail
          pages_sitemap_url="https://omrantoys-live-app.pages.dev/sitemap.xml"
          custom_sitemap_url="https://omrantoys.store/sitemap.xml"
          body="$(mktemp)"
          headers="$(mktemp)"
          cleanup() { rm -f "$body" "$headers"; }
          trap cleanup EXIT

          # Use the canonical Pages hostname as the hard deployment gate. The
          # custom domain can apply bot/WAF policy to GitHub-hosted runners and
          # return 403 even when the just-deployed Pages asset is healthy.
          status="$(curl -sS -L --max-time 30 \
            -A 'Mozilla/5.0 (compatible; OmranStorefrontDeployCheck/1.0)' \
            -H 'Accept: application/xml,text/xml;q=0.9,*/*;q=0.8' \
            -D "$headers" -o "$body" -w '%{http_code}' "$pages_sitemap_url")"

          test "$status" = "200" || { echo "::error::Pages sitemap returned HTTP $status"; exit 1; }

          content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/\r$/, "", $0); print substr($0, index($0, ":") + 2)}' "$headers" | tail -n 1)"
          echo "sitemap Content-Type: ${content_type:-missing}"

          grep -Eq '^<\?xml|<urlset([[:space:]>])' "$body" || {
            echo "::error::sitemap.xml is not XML (likely SPA fallback HTML)."
            head -c 300 "$body" || true
            echo
            exit 1
          }

          if grep -Eqi '<!doctype html|<html([[:space:]>])' "$body"; then
            echo "::error::sitemap.xml resolved to HTML instead of the static XML asset."
            exit 1
          fi

          case "${content_type,,}" in
            application/xml*|text/xml*|application/xhtml+xml*) ;;
            *)
              echo "::warning::Unexpected sitemap Content-Type: ${content_type:-missing}. Body is valid XML; check Cloudflare asset headers if Search Console still complains."
              ;;
          esac

          echo "Pages sitemap probe: PASS"

          custom_status="$(curl -sS -L --max-time 30 \
            -A 'Mozilla/5.0 (compatible; OmranStorefrontDeployCheck/1.0)' \
            -H 'Accept: application/xml,text/xml;q=0.9,*/*;q=0.8' \
            -o /dev/null -w '%{http_code}' "$custom_sitemap_url" || true)"

          if [ "$custom_status" = "200" ]; then
            echo "Custom-domain sitemap probe: PASS"
          else
            echo "::warning::Custom-domain sitemap probe returned HTTP ${custom_status:-curl-error}. The Pages deployment is healthy; review Cloudflare bot/WAF rules for GitHub-hosted runners if this persists."
          fi

      - name: Report storefront deployment
        run: |
          echo "Storefront project: omrantoys-live-app"
          echo "Commit: ${GITHUB_SHA}"
          echo "Catalog source: ${CATALOG_SOURCE:-validated-artifact}"
          echo "Catalog provenance:"
          cat release-inputs/catalog-provenance.txt
