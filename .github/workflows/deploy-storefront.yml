name: Deploy Storefront to Cloudflare Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "public/**"
      - "shared/**"
      - "scripts/**"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-storefront.yml"
  push:
    branches: [main]
    paths:
      - "client/**"
      - "public/**"
      - "shared/**"
      - "scripts/**"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-storefront.yml"

concurrency:
  group: omran-storefront-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  PRODUCTS_SHEET_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTLph4MyfmoeWcjJ3cMi-iDaM3dgt4_S57SvKr6wpQu8IbDKliduguIcvtp7E5o0ZoxN3ouNQoZo7dn/pub?gid=2000000005&single=true&output=csv

jobs:
  validate-storefront:
    name: Validate storefront integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate approved public catalog snapshot
        run: |
          pnpm exec esbuild scripts/generate-public-products-snapshot.ts --bundle --platform=node --format=esm --outfile=/tmp/generate-public-products-snapshot.mjs
          node /tmp/generate-public-products-snapshot.mjs

      - name: Repository integration audit
        run: node scripts/integration-audit.mjs

      - name: Quality gates
        run: |
          pnpm lint
          pnpm check
          pnpm test

      - name: Build storefront
        run: pnpm build

      - name: Assert verified catalog and images are bundled
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/index.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('client/src/lib/publicProductsSnapshot.ts').read_text(encoding='utf-8')
          product_ids = re.findall(
              r'^\s*(?:"id"|id):\s*"([^"]+)"',
              source,
              flags=re.MULTILINE,
          )
          images = re.findall(
              r'^\s*(?:"image"|image):\s*"([^"]+)"',
              source,
              flags=re.MULTILINE,
          )

          assert product_ids, 'verified snapshot contains no product IDs'
          assert len(product_ids) == len(set(product_ids)), f'duplicate snapshot product IDs: {product_ids}'
          assert len(images) == len(product_ids), (
              f'every public product must have exactly one image: {len(images)} images / {len(product_ids)} products'
          )

          remote_images = [image for image in images if not image.startswith('/products/processed/')]
          assert not remote_images, f'public products still depend on remote image URLs: {remote_images}'

          missing_images = []
          for image in images:
              path = Path('dist/public') / image.lstrip('/')
              if not path.is_file() or path.stat().st_size < 1024:
                  missing_images.append(image)
          assert not missing_images, f'missing/invalid product image assets: {missing_images}'

          assets = Path('dist/public/assets')
          assert assets.is_dir(), 'built assets directory is missing'
          built_text = '\n'.join(
              p.read_text(encoding='utf-8', errors='ignore')
              for p in assets.rglob('*') if p.is_file()
          )
          missing_products = [product_id for product_id in product_ids if product_id not in built_text]
          assert not missing_products, f'missing verified products in storefront bundle: {missing_products}'

          Path('/tmp/public-product-count').write_text(str(len(product_ids)), encoding='utf-8')
          Path('/tmp/public-image-count').write_text(str(len(images)), encoding='utf-8')
          print(
              f'Storefront bundle: PASS ({len(product_ids)} verified products, '
              f'{len(images)} same-origin images)'
          )
          PY

  deploy-storefront:
    name: Deploy storefront production
    if: github.event_name != 'pull_request'
    needs: validate-storefront
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate approved public catalog snapshot
        run: |
          pnpm exec esbuild scripts/generate-public-products-snapshot.ts --bundle --platform=node --format=esm --outfile=/tmp/generate-public-products-snapshot.mjs
          node /tmp/generate-public-products-snapshot.mjs

      - name: Build storefront
        run: pnpm build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo '::error::CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }

      - name: Deploy Cloudflare Pages production
        run: pnpm exec wrangler pages deploy dist/public --project-name=omrantoys-live-app --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report storefront deployment
        run: |
          echo "Storefront project: omrantoys-live-app"
          echo "Commit: ${GITHUB_SHA}"
          echo "Catalog source: Omran Trading Master Database / published products view"
