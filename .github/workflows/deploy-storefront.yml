name: Deploy Storefront to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "public/**"
      - "shared/**"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".env.production"
      - ".github/workflows/deploy-storefront.yml"

concurrency:
  group: omran-storefront-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  deploy-storefront:
    name: Build, validate and deploy storefront
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo '::error::CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: |
          pnpm lint
          pnpm check
          pnpm test

      - name: Build storefront
        run: pnpm build

      - name: Assert verified product snapshot is bundled
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          test -f dist/public/products/processed/product-kitchen-46pcs-main.webp
          test -f dist/public/products/processed/product-home-chef-104pcs-main.webp
          test -f dist/public/products/processed/product-ot-00001-main.webp

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          source = Path('client/src/lib/publicProductsSnapshot.ts').read_text(encoding='utf-8')
          product_ids = re.findall(r'^\s*id:\s*"([^"]+)"', source, flags=re.MULTILINE)
          assert product_ids, 'verified snapshot contains no product IDs'
          assert len(product_ids) == len(set(product_ids)), f'duplicate snapshot product IDs: {product_ids}'

          assets = Path('dist/public/assets')
          assert assets.is_dir(), 'built assets directory is missing'
          built_text = '\n'.join(
              p.read_text(encoding='utf-8', errors='ignore')
              for p in assets.rglob('*') if p.is_file()
          )
          missing = [product_id for product_id in product_ids if product_id not in built_text]
          assert not missing, f'missing verified products in storefront bundle: {missing}'

          Path('/tmp/public-product-count').write_text(str(len(product_ids)), encoding='utf-8')
          print(f'Storefront product bundle: PASS ({len(product_ids)} verified public products)')
          PY

      - name: Deploy Cloudflare Pages production
        run: pnpm exec wrangler pages deploy dist/public --project-name=omrantoys-live-app --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report storefront deployment
        run: |
          echo "Storefront project: omrantoys-live-app"
          echo "Commit: ${GITHUB_SHA}"
          echo "Verified public products: $(cat /tmp/public-product-count)"
