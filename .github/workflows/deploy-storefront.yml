name: Deploy Storefront to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "public/**"
      - "shared/**"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".env.production"
      - ".github/workflows/deploy-storefront.yml"

concurrency:
  group: omran-storefront-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  deploy-storefront:
    name: Build, validate and deploy storefront
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo '::error::CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: |
          pnpm lint
          pnpm check
          pnpm test

      - name: Build storefront
        run: pnpm build

      - name: Assert published products are bundled
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          test -f dist/public/products/processed/product-kitchen-46pcs-main.webp
          test -f dist/public/products/processed/product-home-chef-104pcs-main.webp
          test -f dist/public/products/processed/product-ot-00001-main.webp
          grep -R -q 'OMR-IG-KIT-46' dist/public/assets
          grep -R -q 'OMR-IG-HC-104' dist/public/assets
          grep -R -q 'OMR-IG-SQ-01' dist/public/assets
          echo 'Storefront product bundle: PASS (3 verified public products + images)'

      - name: Deploy Cloudflare Pages production
        run: pnpm exec wrangler pages deploy dist/public --project-name=omrantoys-live-app --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report storefront deployment
        run: |
          echo "Storefront project: omrantoys-live-app"
          echo "Commit: ${GITHUB_SHA}"
          echo "Expected public products: 3"
