name: Gap Analysis Final Merge Validation

on:
  push:
    branches:
      - gap-analysis-final-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Diff whitespace check
        run: git diff --check origin/main..HEAD
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
