name: Master Data Pipeline Pre-Merge Test (API-Free)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/master-data-pipeline-premerge-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-one-approved-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ops/master-schema-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run one-product API-free validation
        env:
          TEST_PRODUCT_ID: OMR-RAW-001
        run: node scripts/master-data-pipeline.mjs

      - name: Assert zero credential/API dependency
        run: |
          set -euo pipefail
          ! grep -R "GEMINI_API_KEY\|GOOGLE_SERVICE_ACCOUNT_JSON\|generativelanguage.googleapis.com\|sheets.googleapis.com\|oauth2.googleapis.com" scripts/master-data-pipeline.mjs .github/workflows/master-data-pipeline.yml docs/MASTER-SCHEMA-V1.md
          git diff --exit-code -- public/catalog/products.csv
          echo "Pre-merge API-free validation: PASS"
